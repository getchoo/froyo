name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Build release.nix (${{ matrix.target }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd # v31

      - name: Run tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          nix build \
            --no-link \
            --print-build-logs \
            --print-out-paths \
            --show-trace \
            --file release.nix \
            "outputs.perTarget.$TARGET" \
            >> "$GITHUB_STEP_SUMMARY"
